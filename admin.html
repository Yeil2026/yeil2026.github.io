<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>예일유치원 게시물 관리</title><link rel="stylesheet" href="style.css"></head><body><main><a href="index.html">← 홈페이지</a><h1>예일유치원 게시물 관리 도구</h1><p class="warning">이 화면은 로그인 기능이 없는 파일 편집 도구입니다. 저장한 내용은 현재 브라우저에만 임시 저장되며, 공개하려면 content.js를 내려받아 GitHub에 교체 업로드해야 합니다. 개인정보나 비공개 자료를 등록하지 마세요.</p><div class="row"><button id="export">공개용 content.js 다운로드</button><button id="reset" class="secondary">임시 저장 초기화 / 공개본 다시 불러오기</button><a class="button secondary" href="https://github.com/Yeil2026/yeil2026.github.io/upload/main" target="_blank" rel="noopener">GitHub 업로드</a></div><p id="status" role="status"></p><section class="card"><h2>홈페이지 기본 설정</h2><div id="settings"></div><label>로고 사진 선택 (선택사항)</label><input type="file" id="logoFile" accept="image/jpeg,image/png,image/webp,image/gif"><label>메인 사진 선택 (선택사항)</label><input type="file" id="heroFile" accept="image/jpeg,image/png,image/webp,image/gif"><p><button id="saveSettings">기본 설정 임시 저장</button></p></section><section class="card"><h2 id="formTitle">새 게시물 등록</h2><form id="postForm"><label for="section">메뉴</label><select id="section"></select><label for="category">카테고리</label><select id="category"></select><label for="date">날짜 (행사는 실제 행사 날짜)</label><input type="date" id="date" required><label for="title">제목</label><input id="title" required><label for="body">본문</label><textarea id="body"></textarea><label>사진 파일 (여러 장 선택 가능, 각 2MB 이하)</label><input id="photos" type="file" multiple accept="image/jpeg,image/png,image/webp,image/gif"><label>사진 주소 또는 GitHub 경로 (한 줄에 하나)</label><textarea id="imageLinks" placeholder="images/event.jpg"></textarea><div id="existingImages"></div><label>PDF 첨부 (여러 개 선택 가능, 각 2MB 이하)</label><input id="pdfs" type="file" multiple accept="application/pdf"><label>첨부파일 이름 | 주소 (한 줄에 하나)</label><textarea id="fileLinks" placeholder="연간 행사계획안.pdf | documents/annual.pdf"></textarea><div id="existingFiles"></div><label for="youtube">유튜브 영상 주소</label><input id="youtube" placeholder="https://youtu.be/…"><label for="video">MP4 파일 주소 또는 GitHub 경로</label><input id="video" placeholder="videos/promo.mp4"><label for="link">관련 블로그·인스타그램·외부 링크</label><input id="link" placeholder="https://…"><p class="row"><button type="submit">게시물 임시 저장</button><button type="button" id="clear" class="secondary">새 글 작성</button></p></form></section><section class="card"><h2>등록한 게시물 관리</h2><label>메뉴별 보기</label><select id="filter"></select><div id="list"></div></section></main><script src="content.js"></script><script src="common.js"></script><script>
const KEY='yeil-v2-draft';let draft=JSON.parse(JSON.stringify(DATA));try{let old=localStorage.getItem(KEY);if(old)draft=JSON.parse(old)}catch{}draft.settings=draft.settings||{};draft.posts=draft.posts||[];let editing=null,keepImages=[],keepFiles=[];const fields=[['name','유치원 이름'],['headline','메인 제목'],['intro','소개 문구'],['phone','전화번호'],['blog','네이버 블로그 주소'],['instagram','인스타그램 주소'],['logo','로고 주소 또는 경로'],['hero','메인 사진 주소 또는 경로']];function status(t){$('status').textContent=t}function store(){try{localStorage.setItem(KEY,JSON.stringify(draft));status('이 브라우저에 임시 저장했습니다. 공개하려면 content.js를 다운로드하세요.')}catch{status('브라우저 저장 용량을 초과했거나 저장이 차단되었습니다. 현재 화면의 내용은 남아 있으니 닫기 전에 content.js를 다운로드하세요.')}}function option(p,v,t){let o=E('option',t);o.value=v;p.append(o)}function setupSettings(){ $('settings').replaceChildren();for(let [k,t] of fields){let l=E('label',t);l.htmlFor='s_'+k;let inp=E('input');inp.id='s_'+k;inp.value=draft.settings[k]||'';$('settings').append(l,inp)}}setupSettings();function read(f){return new Promise((res,rej)=>{if(f.size>2*1024*1024)return rej(Error(f.name+' : 2MB 이하 파일만 직접 등록할 수 있습니다.'));if(!/^(image\/(jpeg|png|webp|gif)|application\/pdf)$/.test(f.type))return rej(Error('지원하지 않는 파일: '+f.name));let r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(Error('파일 읽기 실패'));r.readAsDataURL(f)})}function valid(u,k){if(u&&!safe(u,k))throw Error('지원하지 않는 주소: '+u.slice(0,80));return u}function collectSettings(){let n={};for(let [k] of fields)n[k]=$('s_'+k).value.trim();for(let k of ['blog','instagram'])valid(n[k]);for(let k of ['logo','hero'])valid(n[k],'image');return n}$('saveSettings').onclick=async()=>{try{let n=collectSettings();for(let k of ['logo','hero'])if($(k+'File').files[0])n[k]=await read($(k+'File').files[0]);draft.settings=n;setupSettings();$('logoFile').value=$('heroFile').value='';store()}catch(e){alert(e.message)}};MENU.forEach(m=>{option($('section'),m[0],m[1]);option($('filter'),m[0],m[1])});option($('filter'),'','전체 메뉴');$('filter').value='';function cats(){let m=MENU.find(x=>x[0]===$('section').value);$('category').replaceChildren();m[2].forEach((v,i)=>option($('category'),i,v))}$('section').onchange=cats;cats();function today(){let d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}function keep(){for(let [id,arr] of [['existingImages',keepImages],['existingFiles',keepFiles]]){$(id).replaceChildren();arr.forEach((v,i)=>{let r=E('div','','row');if(id==='existingImages'){let im=img(v,'등록 사진');im.style.width='90px';r.append(im)}else r.append(E('span',v.name));let b=E('button','제거','secondary');b.type='button';b.onclick=()=>{arr.splice(i,1);keep()};r.append(b);$(id).append(r)})}}function clear(){editing=null;$('postForm').reset();cats();$('date').value=today();keepImages=[];keepFiles=[];keep();$('formTitle').textContent='새 게시물 등록'}$('clear').onclick=clear;clear();function lines(id){return $(id).value.split('\n').map(x=>x.trim()).filter(Boolean)}$('postForm').onsubmit=async e=>{e.preventDefault();try{let images=[...keepImages,...lines('imageLinks').map(u=>valid(u,'image'))];for(let f of $('photos').files)images.push(await read(f));let attachments=[...keepFiles];for(let l of lines('fileLinks')){let [n,...rest]=l.split('|');let u=rest.join('|').trim();if(!u)throw Error('첨부파일은 이름 | 주소 형식으로 적어주세요.');attachments.push({name:n.trim(),url:valid(u,'pdf')})}for(let f of $('pdfs').files)attachments.push({name:f.name,url:await read(f)});let x={id:editing|| (globalThis.crypto?.randomUUID?.()||String(Date.now())),section:$('section').value,category:Number($('category').value),date:$('date').value,title:$('title').value.trim(),body:$('body').value,images,attachments,youtube:$('youtube').value.trim(),video:valid($('video').value.trim()),link:valid($('link').value.trim())};if(!x.title)throw Error('제목을 입력하세요.');let idx=draft.posts.findIndex(p=>p.id===x.id);if(idx>=0)draft.posts[idx]=x;else draft.posts.push(x);store();clear();list()}catch(e){alert(e.message)}};function edit(x){clear();editing=x.id;$('section').value=x.section;cats();$('category').value=x.category;for(let k of ['date','title','body','youtube','video','link'])$(k).value=x[k]||'';keepImages=[...(x.images||[])];keepFiles=[...(x.attachments||[])];keep();$('formTitle').textContent='게시물 수정';$('formTitle').scrollIntoView({behavior:'smooth'})}function list(){$('list').replaceChildren();let items=draft.posts.filter(x=>!$('filter').value||x.section===$('filter').value).sort((a,b)=>b.date.localeCompare(a.date));if(!items.length)$('list').append(E('p','게시물이 없습니다.'));for(let x of items){let r=E('div','','listitem'),m=MENU.find(y=>y[0]===x.section);r.append(E('small',x.date+' · '+m?.[1]+' / '+m?.[2][x.category]),E('h3',x.title));let a=E('button','수정','secondary'),b=E('button','삭제','danger');a.onclick=()=>edit(x);b.onclick=()=>{if(confirm('이 게시물을 삭제할까요?')){draft.posts=draft.posts.filter(p=>p.id!==x.id);if(editing===x.id)clear();store();list()}};r.append(a,document.createTextNode(' '),b);$('list').append(r)}}$('filter').onchange=list;list();$('export').onclick=()=>{let content='window.YEIL = '+JSON.stringify(draft,null,2)+';\n';let blob=new Blob([content],{type:'text/javascript;charset=utf-8'});if(blob.size>24*1024*1024){alert('파일 용량이 너무 큽니다. 사진과 PDF를 GitHub에 별도 파일로 올리고 경로를 입력하세요.');return}let a=E('a');a.href=URL.createObjectURL(blob);a.download='content.js';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);status('다운로드한 content.js를 GitHub 저장소에 교체 업로드하세요. 브라우저에서 파일명에 (1)이 붙었다면 content.js로 바꾸세요.')};$('reset').onclick=()=>{if(confirm('현재 브라우저의 임시 수정 내용을 지우고 현재 공개본을 다시 불러올까요?')){try{localStorage.removeItem(KEY)}catch{}location.reload()}};
</script></body></html>
