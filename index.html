<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>예일유치원</title><link rel="stylesheet" href="style.css"></head><body><header><div class="wrap"><div class="top"><a class="brand" id="brand" href="#home"></a><a id="phone" class="button">입학 문의</a></div><nav class="nav" id="nav"></nav></div></header><main id="main"></main><footer><div class="wrap"><strong>동대문구 예일유치원</strong><p id="foot"></p><small>© 예일유치원 · <a href="admin.html">게시물 관리 도구</a></small></div></footer><script src="content.js"></script><script src="common.js"></script><script>
const s=DATA.settings||{}, posts=DATA.posts||[];const main=$('main');$('brand').append(s.logo?img(s.logo,'로고'):E('span','🌿'),E('span',s.name||'예일유치원'));$('phone').href='tel:'+(s.phone||'').replace(/[^0-9+]/g,'');$('foot').textContent='입학 및 교육 상담 '+(s.phone||'');function route(t,h,c=''){let a=E('a',t,c);a.href=h;return a}MENU.forEach(m=>$('nav').append(route(m[1],'#'+m[0]+'/0')));function sorted(p){return [...p].sort((a,b)=>(b.date||'').localeCompare(a.date||''))}function cards(p,items){let g=E('div','','grid');if(!items.length){p.append(E('p','등록된 게시물이 없습니다.','card muted'));return}sorted(items).forEach(x=>{let c=E('article','','card');if(x.images?.[0])c.append(img(x.images[0],x.title));c.append(E('small',x.date||''),E('h3',x.title),E('p',(x.body||'').slice(0,95)),route('자세히 보기 →','#post/'+encodeURIComponent(x.id),'button secondary'));g.append(c)});p.append(g)}function socials(p){let r=E('div','','row');if(s.blog)r.append(A('네이버 블로그',s.blog));if(s.instagram)r.append(A('인스타그램',s.instagram));p.append(r)}function home(){let h=E('div','','hero'),a=E('div');a.append(E('small','PLAY · NATURE · GROWTH'),E('h1',s.headline||''),E('p',s.intro||''),route('교육과정 보기','#education/0','button'));h.append(a);if(s.hero)h.append(img(s.hero,'유치원 대표 사진'));else{let art=E('div');art.innerHTML='<svg viewBox="0 0 400 230" role="img" aria-label="숲 일러스트"><circle cx="310" cy="45" r="33" fill="#ecd28b"/><path d="M0 140 Q100 30 200 140 T400 120 V230 H0Z" fill="#a9bf94"/><path d="M0 180 Q110 100 220 180 T400 160 V230 H0Z" fill="#789d74"/><g fill="#416b4e"><path d="M80 25L25 150H135Z"/><path d="M225 50L175 165H275Z"/></g><g fill="#795d42"><rect x="73" y="148" width="14" height="43"/><rect x="218" y="163" width="14" height="35"/></g></svg>';h.append(art)}main.append(h);let g=E('div','','grid');MENU.forEach(m=>{let c=E('div','','card');c.append(E('h3',m[1]));m[2].forEach((v,i)=>{let p=E('div');p.append(route(v,'#'+m[0]+'/'+i));c.append(p)});g.append(c)});main.append(g,E('h2','최근 소식'));cards(main,sorted(posts).slice(0,6));socials(main)}function board(m,i){main.append(E('small','홈 > '+m[1]),E('h1',m[1]));let tabs=E('div','','tabs');m[2].forEach((v,j)=>tabs.append(route(v,'#'+m[0]+'/'+j,j===i?'active':'')));main.append(tabs,E('h2',m[2][i]));let items=posts.filter(x=>x.section===m[0]&&Number(x.category)===i);if(m[0]==='media')socials(main);if(m[0]==='events'){let r=E('div','','row'),y=E('select'),mo=E('select'),years=[...new Set([String(new Date().getFullYear()),String(new Date().getFullYear()+1),...items.map(x=>x.date?.slice(0,4)).filter(Boolean)])].sort().reverse();for(let z of ['전체 연도',...years]){let o=E('option',z);o.value=z==='전체 연도'?'':z;y.append(o)}for(let j=0;j<=12;j++){let o=E('option',j?j+'월':'전체 월');o.value=j?String(j).padStart(2,'0'):'';mo.append(o)}r.append(y,mo);main.append(r);let list=E('div');main.append(list);function render(){list.replaceChildren();cards(list,items.filter(x=>(!y.value||x.date?.startsWith(y.value))&&(!mo.value||x.date?.slice(5,7)===mo.value)))}y.onchange=mo.onchange=render;render()}else cards(main,items)}function detail(x){let m=MENU.find(m=>m[0]===x.section);main.append(route('← 목록으로','#'+x.section+'/'+x.category),E('h1',x.title),E('small',(m?.[1]||'')+' · '+(x.date||'')));let a=E('article','','article');a.append(E('p',x.body||'','bodytext'));(x.images||[]).forEach(u=>{if(safe(u,'image'))a.append(img(u,x.title))});(x.attachments||[]).forEach(f=>{if(!safe(f.url,'pdf'))return;let l=E('a',f.name||'첨부자료','button secondary');l.href=f.url;l.download=f.name||'자료.pdf';if(!f.url.startsWith('data:')){l.target='_blank';l.rel='noopener'}a.append(l,document.createTextNode(' '))});if(x.youtube){let match=x.youtube.match(/(?:youtu\.be\/|[?&]v=|\/embed\/|\/shorts\/)([\w-]{11})/);if(match||/^[\w-]{11}$/.test(x.youtube)){let f=E('iframe');f.src='https://www.youtube-nocookie.com/embed/'+(match?match[1]:x.youtube);f.title=x.title;f.allowFullscreen=true;a.append(f)}}if(safe(x.video)){let v=E('video');v.src=x.video;v.controls=true;v.preload='metadata';a.append(v)}if(safe(x.link))a.append(A('관련 사이트 열기',x.link));main.append(a)}function render(){main.replaceChildren();let [k,j]=(location.hash.slice(1)||'home').split('/');if(k==='post'){let x=posts.find(p=>p.id===decodeURIComponent(j||''));if(x)detail(x);else main.append(E('p','게시물을 찾을 수 없습니다.'))}else{let m=MENU.find(m=>m[0]===k);if(m)board(m,Math.min(m[2].length-1,Math.max(0,Number(j)||0)));else home()}window.scrollTo(0,0)}window.addEventListener('hashchange',render);render();
